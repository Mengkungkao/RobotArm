# ============================================================================
#  ros2_control controller configuration.
#
#  THE SAME FILE IS USED IN SIMULATION AND ON THE REAL ROBOT.
#
#  In simulation it is handed to the gazebo_ros2_control plugin (which hosts a
#  controller_manager inside the simulator); on the real robot it is handed to
#  the standalone ros2_control_node.  Neither the controllers nor anything
#  above them knows which one is running.
# ============================================================================
controller_manager:
  ros__parameters:
    update_rate: 100          # [Hz] control loop rate
    use_sim_time: false       # overridden to true by the simulation launch file

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # The trajectory controller MoveIt executes through.
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Optional direct velocity interface for teleoperation / servoing.
    # Loaded on request only - it claims the same joints as arm_controller,
    # so exactly one of the two can be active at a time.
    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

# ---------------------------------------------------------------------------
# Trajectory controller
# ---------------------------------------------------------------------------
arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 100.0
    action_monitor_rate: 20.0

    # A trajectory must name every joint of the group: a partial goal is
    # almost always a bug in the caller, not an intention.
    allow_partial_joints_goal: false

    # Closed loop: the controller corrects against the measured state.
    open_loop_control: false
    allow_integration_in_goal_trajectories: true

    constraints:
      stopped_velocity_tolerance: 0.02   # [rad/s] "at rest" threshold at the goal
      goal_time: 0.5                     # [s] grace period to reach the goal
      joint_1: {trajectory: 0.20, goal: 0.02}
      joint_2: {trajectory: 0.20, goal: 0.02}
      joint_3: {trajectory: 0.20, goal: 0.02}
      joint_4: {trajectory: 0.20, goal: 0.02}
      joint_5: {trajectory: 0.20, goal: 0.02}
      joint_6: {trajectory: 0.20, goal: 0.02}

# ---------------------------------------------------------------------------
# Optional velocity controller (not started by default)
# ---------------------------------------------------------------------------
velocity_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    interface_name: velocity

# ---------------------------------------------------------------------------
# Joint state broadcaster
# ---------------------------------------------------------------------------
joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false
    # No extra_joints entry on purpose: an empty YAML sequence has no
    # inferrable element type, so rclcpp cannot build a ParameterValue for it
    # and ros2_control_node aborts at startup with
    #   parameter_value_from failed for parameter 'extra_joints'
    # The parameter is optional and already defaults to an empty list.
