# ============================================================================
#  robot_arm - single source of truth for the mechanical description.
#
#  Every dimension, mass and joint limit used by the URDF/Xacro model lives
#  here.  Nothing is hard-coded inside the Xacro files: they read this file
#  with xacro.load_yaml() and build the model from it.
#
#  Units: SI  (metres, kilograms, radians, seconds, Newton-metres)
#
#  Kinematic structure (spherical wrist, so the wrist centre is the origin of
#  joint_5, which makes the arm well conditioned for numerical IK):
#
#    base_link --j1(z)--> link_1 --j2(y)--> link_2 --j3(y)--> link_3
#              --j4(z)--> link_4 --j5(y)--> link_5 --j6(z)--> link_6 --> tool0
# ============================================================================

robot:
  name: robot_arm

# ---------------------------------------------------------------------------
# Link geometry.  Every link is modelled as a cylinder of the given radius and
# length, extruded along its own +Z axis.  `length` is also the distance to the
# next joint, so the kinematic chain is derived from these numbers alone.
# ---------------------------------------------------------------------------
geometry:
  base:
    radius: 0.090
    length: 0.100
  link_1:                 # shoulder yaw housing
    radius: 0.065
    length: 0.120
  link_2:                 # upper arm
    radius: 0.055
    length: 0.300
  link_3:                 # forearm
    radius: 0.050
    length: 0.280
  link_4:                 # wrist roll housing
    radius: 0.045
    length: 0.100
  link_5:                 # wrist pitch housing
    radius: 0.040
    length: 0.080
  link_6:                 # tool flange
    radius: 0.035
    length: 0.050

# ---------------------------------------------------------------------------
# Lateral offsets.  Keep them at 0.0 for a "textbook" arm; set them to match a
# real machine that has its shoulder/elbow bearings off the sagittal plane.
# ---------------------------------------------------------------------------
offsets:
  shoulder_y: 0.0         # base_link -> joint_2 offset along Y
  elbow_y: 0.0            # link_2    -> joint_3 offset along Y
  tool_z: 0.0             # extra flange -> tool0 offset along Z

# ---------------------------------------------------------------------------
# Optional gripper mounting interface (a flat mounting plate + `tool_tip`
# frame).  Enable it with the `use_gripper_mount` Xacro argument.
# ---------------------------------------------------------------------------
gripper_mount:
  plate_radius: 0.038
  plate_thickness: 0.008
  plate_mass: 0.05
  tip_offset: 0.120       # tool0 -> tool_tip distance along Z

# ---------------------------------------------------------------------------
# Masses [kg].
# ---------------------------------------------------------------------------
mass:
  base: 3.00
  link_1: 1.80
  link_2: 2.20
  link_3: 1.40
  link_4: 0.70
  link_5: 0.50
  link_6: 0.25

# ---------------------------------------------------------------------------
# Joint definition.  `axis` is expressed in the parent joint frame.
#   lower/upper : position limits            [rad]
#   velocity    : maximum joint velocity     [rad/s]
#   effort      : maximum joint effort       [Nm]
#   damping     : viscous damping            [Nm*s/rad]
#   friction    : static friction            [Nm]
# The very same numbers are re-used by the MoveIt joint_limits.yaml and by the
# safety layer, so a change here propagates through the whole stack.
# ---------------------------------------------------------------------------
joints:
  joint_1:                # base rotation
    axis: [0, 0, 1]
    lower: -3.1416
    upper: 3.1416
    velocity: 2.60
    effort: 150.0
    damping: 0.50
    friction: 0.20
  joint_2:                # shoulder
    axis: [0, 1, 0]
    lower: -2.0944
    upper: 2.0944
    velocity: 2.20
    effort: 150.0
    damping: 0.50
    friction: 0.20
  joint_3:                # elbow
    axis: [0, 1, 0]
    lower: -2.6180
    upper: 2.6180
    velocity: 2.60
    effort: 100.0
    damping: 0.35
    friction: 0.15
  joint_4:                # wrist rotation
    axis: [0, 0, 1]
    lower: -3.1416
    upper: 3.1416
    velocity: 3.20
    effort: 40.0
    damping: 0.20
    friction: 0.10
  joint_5:                # wrist pitch
    axis: [0, 1, 0]
    lower: -2.0944
    upper: 2.0944
    velocity: 3.20
    effort: 40.0
    damping: 0.20
    friction: 0.10
  joint_6:                # wrist rotation (tool roll)
    axis: [0, 0, 1]
    lower: -3.1416
    upper: 3.1416
    velocity: 3.20
    effort: 20.0
    damping: 0.10
    friction: 0.05

# ---------------------------------------------------------------------------
# Gazebo surface/dynamics properties per link.
# ---------------------------------------------------------------------------
gazebo:
  mu1: 0.6
  mu2: 0.6
  self_collide: false
  base_material: Gazebo/DarkGrey
  link_material: Gazebo/Grey
  joint_material: Gazebo/Orange
