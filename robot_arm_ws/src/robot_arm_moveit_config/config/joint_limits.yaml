# ============================================================================
#  Limits MoveIt uses for time parameterisation.
#
#  VELOCITY mirrors robot_arm_description/config/robot.yaml, which is the
#  authority; a test fails the build if the two drift apart.
#
#  ACCELERATION does not exist in URDF at all, and it is not a free choice: it
#  is a claim about torque.  Whether a joint can reach a given acceleration
#  depends on the inertia it sees - which changes across the workspace - plus
#  gravity, the centrifugal terms and the payload.  These numbers come from
#
#      ros2 run robot_arm_description solve_acceleration_limits.py /tmp/arm.urdf
#
#  which evaluates tau = M(q) qdd + C(q, qd) qd + g(q) by recursive
#  Newton-Euler over sampled states and finds the largest limits whose peak
#  torque stays under 90% of each drive, while the arm is already moving at
#  half of each joint's top speed and carrying its rated 5 kg.
#
#  The result is the profile of a real machine: 0.25 s from rest to full speed
#  on every axis except the heavy shoulder, which takes 0.34 s.  A test
#  re-checks that the drives can deliver what is advertised here, so raising a
#  number without the torque to back it fails the build rather than producing
#  trajectories the arm cannot follow.
# ============================================================================

# Scaling applied when a request does not specify its own.  Conservative on
# purpose: full speed on a real arm should be a deliberate choice.
default_velocity_scaling_factor: 0.3
default_acceleration_scaling_factor: 0.3

joint_limits:
